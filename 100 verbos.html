<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verben-Werkstatt · 100 Verbos Alemães</title>
<style>
  :root{
    --bg: #14171a;
    --bg-panel: #1c2024;
    --bg-card: #20252a;
    --line: #2c3238;
    --brass: #c98a3e;
    --brass-bright: #e3a95c;
    --gear-green: #6f9c76;
    --ink: #e9e4d8;
    --ink-dim: #9aa1a8;
    --red: #b25b52;
    --font-display: 'Special Elite', 'Courier New', monospace;
    --font-body: 'Fira Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  @font-face{
    font-family:'Special Elite'; src: local('Courier New');
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(201,138,62,0.06), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(111,156,118,0.05), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family: var(--font-body);
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{max-width:920px; margin:0 auto;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 2px solid var(--line);
    padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .cog{width:46px;height:46px; flex-shrink:0;}
  .brand h1{
    font-family: var(--font-display);
    font-size: 1.7rem; letter-spacing:0.5px; margin:0; color:var(--brass-bright);
    text-shadow: 0 0 18px rgba(227,169,92,0.15);
  }
  .brand p{margin:2px 0 0; color:var(--ink-dim); font-size:0.85rem;}
  .stats{display:flex; gap:18px; align-items:center;}
  .stat{text-align:right;}
  .stat .num{font-family:var(--font-mono); font-size:1.5rem; color:var(--gear-green); font-weight:600;}
  .stat .lbl{font-size:0.68rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;}

  .progress-track{
    height:8px; background:var(--bg-panel); border:1px solid var(--line); border-radius:4px;
    overflow:hidden; margin-bottom:22px;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--brass), var(--gear-green));
    transition: width 0.4s ease;
  }

  nav.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tab-btn{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:8px 14px; border-radius:6px; font-family:var(--font-body); font-size:0.85rem;
    cursor:pointer; transition:.15s;
  }
  .tab-btn:hover{color:var(--ink); border-color:var(--brass);}
  .tab-btn.active{background:var(--brass); color:#1a1508; border-color:var(--brass); font-weight:600;}

  .mode-switch{display:flex; gap:8px; margin-bottom:22px;}
  .mode-btn{
    flex:1; background:var(--bg-card); border:1px solid var(--line); color:var(--ink);
    padding:12px; border-radius:8px; cursor:pointer; font-size:0.92rem; font-family:var(--font-body);
    transition:.15s; text-align:center;
  }
  .mode-btn.active{border-color:var(--gear-green); box-shadow: inset 0 0 0 1px var(--gear-green); color:var(--gear-green); font-weight:600;}

  /* Flashcard */
  #flash-panel{display:flex; flex-direction:column; align-items:center;}
  .card-counter{color:var(--ink-dim); font-size:0.8rem; margin-bottom:10px; font-family:var(--font-mono);}
  .card{
    width:100%; max-width:520px; min-height:260px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 26px; cursor:pointer; position:relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .card .tag{
    position:absolute; top:14px; left:14px; font-size:0.62rem; letter-spacing:1px;
    text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line);
    padding:3px 8px; border-radius:20px;
  }
  .card .infinitive{
    font-family:var(--font-display); font-size:2.1rem; color:var(--brass-bright); text-align:center;
  }
  .card .hint{color:var(--ink-dim); font-size:0.78rem; margin-top:14px;}
  .card .back-content{display:none; text-align:center; width:100%;}
  .card.flipped .infinitive{display:none;}
  .card.flipped .hint{display:none;}
  .card.flipped .back-content{display:block;}
  .back-content .pt{font-size:1.5rem; color:var(--ink); font-weight:600; margin-bottom:8px;}
  .back-content .note{
    font-family:var(--font-mono); font-size:0.82rem; color:var(--gear-green);
    background:rgba(111,156,118,0.08); border:1px solid rgba(111,156,118,0.25);
    padding:8px 12px; border-radius:6px; margin:10px 0; display:inline-block;
  }
  .back-content .example{color:var(--ink-dim); font-size:0.9rem; margin-top:10px; line-height:1.5;}
  .back-content .example b{color:var(--ink); font-weight:500;}

  .card-actions{display:flex; gap:12px; margin-top:18px; width:100%; max-width:520px;}
  .card-actions button{
    flex:1; padding:13px; border-radius:8px; border:1px solid var(--line); cursor:pointer;
    font-family:var(--font-body); font-size:0.9rem; font-weight:600; transition:.15s;
  }
  .btn-review{background:transparent; color:var(--red); border-color:var(--red);}
  .btn-review:hover{background:rgba(178,91,82,0.12);}
  .btn-known{background:var(--gear-green); color:#0f1a10; border-color:var(--gear-green);}
  .btn-known:hover{filter:brightness(1.1);}

  /* Quiz */
  #quiz-panel{display:none;}
  .quiz-q{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:28px; text-align:center; margin-bottom:16px;
  }
  .quiz-q .prompt-label{color:var(--ink-dim); font-size:0.75rem; text-transform:uppercase; letter-spacing:1px;}
  .quiz-q .prompt-word{font-family:var(--font-display); font-size:2rem; color:var(--brass-bright); margin:8px 0;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:560px){.options{grid-template-columns:1fr;}}
  .opt{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    padding:14px; border-radius:8px; cursor:pointer; font-size:0.92rem; text-align:left;
    transition:.12s;
  }
  .opt:hover{border-color:var(--brass);}
  .opt.correct{background:rgba(111,156,118,0.2); border-color:var(--gear-green); color:var(--gear-green);}
  .opt.wrong{background:rgba(178,91,82,0.2); border-color:var(--red); color:var(--red);}
  .quiz-feedback{text-align:center; min-height:24px; margin:14px 0; font-size:0.9rem; color:var(--ink-dim);}
  .quiz-next{
    display:block; margin:0 auto; background:var(--brass); color:#1a1508; border:none;
    padding:12px 28px; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.9rem;
  }
  .quiz-next[disabled]{opacity:0.3; cursor:default;}

  .empty{text-align:center; color:var(--ink-dim); padding:40px 20px;}
  .reset-row{text-align:center; margin-top:32px;}
  .reset-row button{
    background:none; border:1px solid var(--line); color:var(--ink-dim); padding:8px 16px;
    border-radius:6px; cursor:pointer; font-size:0.78rem;
  }
  .reset-row button:hover{border-color:var(--red); color:var(--red);}
</style>
</head>

  </section>

  <div class="reset-row">
    <button id="reset-btn">Reiniciar progresso desta categoria</button>
  </div>
</div>

const TYPE_LABELS = {modal:"Modal", regular:"Regular", irregular:"Irregular", separable:"Separável"};
const TYPE_ORDER = ["all","modal","regular","irregular","separable"];

const STORAGE_KEY = "verben_werkstatt_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {mastered:{}, lastDate:null, streak:0};
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();

// streak logic: count a study day when user interacts
function touchStreak(){
  const today = new Date().toDateString();
  if(state.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(state.lastDate === yesterday){ state.streak += 1; }
  else if(state.lastDate === null){ state.streak = 1; }
  else { state.streak = 1; }
  state.lastDate = today;
  saveState();
}

let currentCategory = "all";
let mode = "flash"; // flash | quiz
let deck = [];
let deckIndex = 0;
let quizPool = [];
let quizIndex = 0;
let quizAnswered = false;

function getVerbsForCategory(cat){
  return cat === "all" ? VERBS : VERBS.filter(v=>v.type===cat);
}

function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TYPE_ORDER.forEach(cat=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (cat===currentCategory ? " active":"");
    const count = getVerbsForCategory(cat).length;
    btn.textContent = (cat==="all" ? "Todos" : TYPE_LABELS[cat]) + " (" + count + ")";
    btn.onclick = ()=>{ currentCategory = cat; onCategoryChange(); };
    nav.appendChild(btn);
  });
}

function onCategoryChange(){
  buildTabs();
  if(mode==="flash") startFlashDeck();
  else startQuiz();
  updateStats();
}

function updateStats(){
  const list = getVerbsForCategory(currentCategory);
  const masteredCount = list.filter(v=>state.mastered[v.id]).length;
  document.getElementById("stat-mastered").textContent = masteredCount + "/" + list.length;
  document.getElementById("stat-streak").textContent = state.streak;
  const pct = list.length ? Math.round(100*masteredCount/list.length) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}

/* ---------- FLASHCARDS ---------- */
function startFlashDeck(){
  deck = shuffle(getVerbsForCategory(currentCategory).filter(v=>!state.mastered[v.id]));
  if(deck.length === 0) deck = shuffle(getVerbsForCategory(currentCategory)); // all mastered, review anyway
  deckIndex = 0;
  renderFlashCard();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function renderFlashCard(){
  const card = document.getElementById("card");
  if(deck.length === 0){
    document.getElementById("flash-counter").textContent = "";
    card.classList.remove("flipped");
    document.getElementById("card-front").textContent = "🎉";
    document.getElementById("card-tag").textContent = "";
    return;
  }
  const v = deck[deckIndex];
  card.classList.remove("flipped");
  document.getElementById("flash-counter").textContent = (deckIndex+1) + " / " + deck.length;
  document.getElementById("card-tag").textContent = TYPE_LABELS[v.type];
  document.getElementById("card-front").textContent = v.de;
  document.getElementById("card-pt").textContent = v.pt;
  document.getElementById("card-note").textContent = v.note;
  document.getElementById("card-example").innerHTML = "<b>" + v.ex + "</b><br>" + v.expt;
}
function nextFlash(known){
  const v = deck[deckIndex];
  if(v){
    if(known){ state.mastered[v.id] = true; }
    saveState();
    touchStreak();
  }
  if(deckIndex < deck.length - 1){
    deckIndex++;
  } else {
    deck = shuffle(getVerbsForCategory(currentCategory).filter(v=>!state.mastered[v.id]));
    deckIndex = 0;
  }
  updateStats();
  renderFlashCard();
}

/* ---------- QUIZ ---------- */
function startQuiz(){
  quizPool = shuffle(getVerbsForCategory(currentCategory));
  quizIndex = 0;
  renderQuiz();
}
function renderQuiz(){
  quizAnswered = false;
  document.getElementById("quiz-feedback").textContent = "";
  document.getElementById("quiz-next").disabled = true;
  if(quizPool.length === 0){
    document.getElementById("quiz-word").textContent = "";
    return;
  }
  if(quizIndex >= quizPool.length){
    quizPool = shuffle(getVerbsForCategory(currentCategory));
    quizIndex = 0;
  }
  const v = quizPool[quizIndex];
  document.getElementById("quiz-word").textContent = v.de;

  const pool = getVerbsForCategory(currentCategory).filter(x=>x.id!==v.id);
  const distractors = shuffle(pool).slice(0,3).map(x=>x.pt);
  const options = shuffle([v.pt, ...distractors]);

  const optDiv = document.getElementById("quiz-options");
  optDiv.innerHTML = "";
  options.forEach(optPt=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = optPt;
    btn.onclick = ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      touchStreak();
      const buttons = optDiv.querySelectorAll(".opt");
      buttons.forEach(b=>{
        if(b.textContent === v.pt) b.classList.add("correct");
      });
      if(optPt === v.pt){
        state.mastered[v.id] = true;
        document.getElementById("quiz-feedback").textContent = "Isso mesmo! " + v.de + " = " + v.pt + " · " + v.ex;
      } else {
        btn.classList.add("wrong");
        document.getElementById("quiz-feedback").textContent = "Quase! " + v.de + " significa \"" + v.pt + "\". Exemplo: " + v.ex;
      }
      saveState();
      updateStats();
      document.getElementById("quiz-next").disabled = false;
    };
    optDiv.appendChild(btn);
  });
}
function nextQuiz(){
  quizIndex++;
  renderQuiz();
}

/* ---------- MODE SWITCH ---------- */
function setMode(m){
  mode = m;
  document.getElementById("mode-flash-btn").classList.toggle("active", m==="flash");
  document.getElementById("mode-quiz-btn").classList.toggle("active", m==="quiz");
  document.getElementById("flash-panel").style.display = m==="flash" ? "flex":"none";
  document.getElementById("quiz-panel").style.display = m==="quiz" ? "block":"none";
  if(m==="flash") startFlashDeck(); else startQuiz();
}

/* ---------- EVENTS ---------- */
document.getElementById("card").addEventListener("click", ()=>{
  document.getElementById("card").classList.toggle("flipped");
});
document.getElementById("btn-known").addEventListener("click", (e)=>{ e.stopPropagation(); nextFlash(true); });
document.getElementById("btn-review").addEventListener("click", (e)=>{ e.stopPropagation(); nextFlash(false); });
document.getElementById("mode-flash-btn").addEventListener("click", ()=>setMode("flash"));
document.getElementById("mode-quiz-btn").addEventListener("click", ()=>setMode("quiz"));
document.getElementById("quiz-next").addEventListener("click", nextQuiz);
document.getElementById("reset-btn").addEventListener("click", ()=>{
  if(!confirm("Reiniciar o progresso desta categoria?")) return;
  getVerbsForCategory(currentCategory).forEach(v=> delete state.mastered[v.id]);
  saveState();
  updateStats();
  if(mode==="flash") startFlashDeck(); else startQuiz();
});

/* ---------- INIT ---------- */
buildTabs();
updateStats();
startFlashDeck();
</script>
