<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Vocab Master</title>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --card: #1e1e24;
    --border: #2a2a34;
    --accent: #7c6af7;
    --accent-dim: #2a2550;
    --accent-text: #a89ff8;
    --gold: #f0b429;
    --gold-dim: #2d2200;
    --green: #3ecf8e;
    --green-dim: #0d2e1e;
    --red: #f0545a;
    --red-dim: #2d0f10;
    --text: #e8e6f0;
    --text-2: #9996b0;
    --text-3: #5a576e;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  .app { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  /* Header */
  .site-header { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .logo { width: 42px; height: 42px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .site-header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  .site-header p { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  /* Theme picker */
  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .theme-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; transition: all 0.18s; }
  .theme-card:hover { border-color: var(--accent); background: var(--surface); }
  .theme-card.active { border-color: var(--accent); background: var(--accent-dim); }
  .theme-card .icon { font-size: 28px; margin-bottom: 8px; }
  .theme-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
  .theme-card .count { font-size: 12px; color: var(--text-3); margin-top: 4px; }

  /* Progress */
  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-label { font-size: 13px; color: var(--text-2); }
  .progress-pct { font-size: 13px; font-weight: 600; color: var(--accent-text); }
  .progress-track { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }

  /* Group nav */
  .group-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .gn-pill { padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-3); cursor: pointer; transition: all 0.15s; }
  .gn-pill:hover { border-color: var(--accent); color: var(--accent-text); }
  .gn-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-text); }
  .gn-pill.done { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  /* Mode tabs */
  .mode-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .mode-tab { padding: 8px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .mode-tab:hover { border-color: var(--accent); color: var(--accent-text); }
  .mode-tab.active { background: var(--card); border-color: var(--border); color: var(--text); }

  /* Word card */
  .word-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
  .word-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .word-de { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
  .word-pt { font-size: 15px; color: var(--accent-text); font-weight: 600; margin-top: 3px; }
  .word-badge { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent-text); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }

  .section-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .definition { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 1.25rem; }

  .examples { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.25rem; }
  .example { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 14px; }
  .example .ex-de { font-size: 13px; font-style: italic; color: var(--text); line-height: 1.5; }
  .example .ex-pt { font-size: 12px; color: var(--text-3); margin-top: 3px; }

  .trick-box { background: var(--gold-dim); border: 1px solid #4a3500; border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: #e0c060; line-height: 1.65; }

  .nav-row { display: flex; gap: 10px; margin-top: 1.25rem; }
  .btn { flex: 1; padding: 11px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: 0.88; }

  /* Quiz */
  .quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
  .quiz-header { margin-bottom: 1.25rem; }
  .quiz-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .quiz-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
  .dots-row { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
  .dot.hit { background: var(--green); }
  .dot.miss { background: var(--red); }
  .dot.cur { background: var(--accent); }
  .quiz-q { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 1.25rem; line-height: 1.5; }
  .quiz-highlight { color: var(--accent-text); }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .opt { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; line-height: 1.4; transition: all 0.18s; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-text); }
  .opt.correct { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .opt:disabled { cursor: default; }
  .feedback { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; line-height: 1.6; margin-bottom: 1rem; }
  .feedback.ok { background: var(--green-dim); border: 1px solid var(--green); color: #7ee8b8; }
  .feedback.err { background: var(--red-dim); border: 1px solid var(--red); color: #f5a0a3; }

  /* Result */
  .result-box { text-align: center; padding: 2rem 1rem; }
  .result-emoji { font-size: 52px; margin-bottom: 0.75rem; }
  .result-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
  .result-sub { font-size: 14px; color: var(--text-2); margin-bottom: 1.5rem; }
  .result-score { display: inline-block; font-size: 32px; font-weight: 800; color: var(--accent-text); margin-bottom: 1rem; }

  /* Welcome */
  .welcome { text-align: center; padding: 2.5rem 1rem 1.5rem; }
  .welcome h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
  .welcome p { font-size: 14px; color: var(--text-2); line-height: 1.7; max-width: 420px; margin: 0 auto 2rem; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 500px) { .theme-grid { grid-template-columns: 1fr; } .options-grid { grid-template-columns: 1fr; } }

  svg.arrow { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
</style>
</head>
<body>
<div class="app">
  <div class="site-header">
    <div class="logo">🇩🇪</div>
    <div>
      <h1>Deutsch Vocab Master</h1>
      <p>200 palavras · definições · exemplos reais · truques · quiz</p>
    </div>
  </div>
  <div id="main"></div>
</div>

<script>
const THEMES = {
  negocios: {
    label: 'Negócios', icon: '💼',
    words: [
      { de:'das Unternehmen', pt:'a empresa', def:'Uma organização que realiza atividades comerciais com fins lucrativos.', ex:[{de:'Das Unternehmen hat viele Mitarbeiter.',pt:'A empresa tem muitos funcionários.'},{de:'Sie gründete ein kleines Unternehmen.',pt:'Ela fundou uma pequena empresa.'}], trick:'🎯 "Unter" = sob + "nehmen" = pegar. Imagina alguém que está "pegando o mundo por baixo" — isso é um empreendedor!' },
      { de:'der Vertrag', pt:'o contrato', def:'Acordo formal e juridicamente vinculante entre duas ou mais partes.', ex:[{de:'Bitte unterschreiben Sie den Vertrag.',pt:'Por favor, assine o contrato.'},{de:'Der Vertrag läuft drei Jahre.',pt:'O contrato dura três anos.'}], trick:'📜 "Ver-TRAG" — pensa em "drag" em inglês: o contrato te arrastra para obrigações! VER-trag = VER-gação.' },
      { de:'die Rechnung', pt:'a fatura / conta', def:'Documento que solicita pagamento por serviço ou produto entregue.', ex:[{de:'Ich habe die Rechnung noch nicht bezahlt.',pt:'Ainda não paguei a fatura.'},{de:'Können Sie mir die Rechnung schicken?',pt:'Pode me mandar a conta?'}], trick:'🧮 "Rechnung" vem de "rechnen" = calcular. RECH-nung = RECalcular. A conta é sempre um recálculo do que você gastou!' },
      { de:'die Besprechung', pt:'a reunião', def:'Encontro formal para discussão de assuntos profissionais.', ex:[{de:'Die Besprechung beginnt um neun Uhr.',pt:'A reunião começa às nove horas.'},{de:'Er hat heute viele Besprechungen.',pt:'Ele tem muitas reuniões hoje.'}], trick:'🗣️ "Be-SPRECHEN" = falar sobre algo. Reunião é o lugar onde todo mundo BE-SPRECHEN (fala demais sobre tudo)!' },
      { de:'der Gewinn', pt:'o lucro / ganho', def:'O dinheiro restante após deduzir todas as despesas operacionais.', ex:[{de:'Der Gewinn stieg im letzten Jahr.',pt:'O lucro cresceu no ano passado.'},{de:'Wir haben keinen Gewinn gemacht.',pt:'Não tivemos lucro.'}], trick:'🏆 "GEWINN" soa como "win" em inglês! Lucro é quando você GANHA (win). Simples assim.' },
      { de:'die Investition', pt:'o investimento', def:'Aplicação de capital com expectativa de retorno financeiro futuro.', ex:[{de:'Die Investition war ein Erfolg.',pt:'O investimento foi um sucesso.'},{de:'Wir brauchen mehr Investitionen.',pt:'Precisamos de mais investimentos.'}], trick:'💰 Quase idêntico ao português! Investition = Investimento. Só troca -mento por -tion. Palavras irmãs!' },
      { de:'der Mitarbeiter', pt:'o funcionário / colega', def:'Pessoa que trabalha em conjunto numa mesma organização.', ex:[{de:'Wir haben zwanzig Mitarbeiter.',pt:'Temos vinte funcionários.'},{de:'Die Mitarbeiter sind sehr motiviert.',pt:'Os funcionários estão muito motivados.'}], trick:'👥 "Mit" = com + "Arbeiter" = trabalhador. Funcionário = "com-trabalhador". Mit-Arbeiter = colaborador literal!' },
      { de:'das Angebot', pt:'a oferta / proposta', def:'Proposta formal de venda com preço e condições especificadas.', ex:[{de:'Das Angebot läuft bis Freitag.',pt:'A oferta vai até sexta-feira.'},{de:'Können Sie uns ein Angebot machen?',pt:'Você pode nos fazer uma proposta?'}], trick:'🎁 "AN-gebot" = AN(ounce) + gebot (mandamento). Uma oferta é um "mandamento de preço" anunciado. Ou pensa: "Ahn, que oferta!"' },
      { de:'die Führung', pt:'a liderança / gestão', def:'Capacidade de conduzir e guiar pessoas ou uma organização.', ex:[{de:'Die Führung des Unternehmens ist stark.',pt:'A liderança da empresa é forte.'},{de:'Er hat die Führung übernommen.',pt:'Ele assumiu a liderança.'}], trick:'🚗 "FÜHRUNG" vem de "führen" = conduzir/guiar. Liderar é como GUIAR um carro cheio de funcionários — você é o motorista!' },
      { de:'der Umsatz', pt:'o faturamento / receita', def:'Total de vendas realizadas em determinado período.', ex:[{de:'Der Umsatz wächst jedes Jahr.',pt:'O faturamento cresce todo ano.'},{de:'Wie hoch ist Ihr Umsatz?',pt:'Qual é o seu faturamento?'}], trick:'🔄 "Um" = em volta + "Satz" = conjunto. Imagina o dinheiro dando uma VOLTA completa pelo caixa — isso é o faturamento!' },
      { de:'die Buchhaltung', pt:'a contabilidade', def:'Registro e controle sistemático das finanças de uma empresa.', ex:[{de:'Die Buchhaltung ist sehr wichtig.',pt:'A contabilidade é muito importante.'},{de:'Er arbeitet in der Buchhaltung.',pt:'Ele trabalha na contabilidade.'}], trick:'📚 "Buch" = livro + "Haltung" = postura/manutenção. Contabilidade = manter os livros em ordem. BUCH-Haltung = guardar livros!' },
      { de:'die Abteilung', pt:'o departamento / seção', def:'Divisão específica dentro de uma empresa com função própria.', ex:[{de:'Welche Abteilung arbeiten Sie?',pt:'Em qual departamento você trabalha?'},{de:'Die Marketing-Abteilung ist groß.',pt:'O departamento de marketing é grande.'}], trick:'✂️ "AB-TEIL-ung" = "ab" (de/fora) + "Teil" (parte). Um departamento é uma PARTE separada da empresa. Ab-teil-ung = a-parte-ação!' },
      { de:'die Bestellung', pt:'o pedido / encomenda', def:'Solicitação formal de compra de produto ou serviço.', ex:[{de:'Ihre Bestellung ist angekommen.',pt:'Seu pedido chegou.'},{de:'Ich möchte eine Bestellung aufgeben.',pt:'Quero fazer um pedido.'}], trick:'📦 "Be-STELL-ung" vem de "stellen" = colocar/pôr. Um pedido é "colocar algo em ordem". Be-stell = be-stelle (encomende)!' },
      { de:'die Lieferung', pt:'a entrega', def:'Ato de transportar e entregar produtos ao destinatário.', ex:[{de:'Die Lieferung kommt morgen.',pt:'A entrega chega amanhã.'},{de:'Wann ist die Lieferung geplant?',pt:'Quando está prevista a entrega?'}], trick:'🚚 "LIEFERUNG" vem de "liefern" = entregar. Soa como "livrar"! Entregar = livrar o produto das suas mãos para as deles.' },
      { de:'der Kunde', pt:'o cliente', def:'Pessoa ou empresa que compra produtos ou contrata serviços.', ex:[{de:'Der Kunde ist immer zufrieden.',pt:'O cliente está sempre satisfeito.'},{de:'Wir haben viele treue Kunden.',pt:'Temos muitos clientes fiéis.'}], trick:'🤝 "KUNDE" soa como "CONDI" ao contrário — o cliente é quem dita as CONDIÇÕES do negócio. Kunde = quem você precisa agradar!' },
      { de:'der Chef', pt:'o chefe / patrão', def:'Pessoa com autoridade e responsabilidade máxima num grupo.', ex:[{de:'Mein Chef ist sehr streng.',pt:'Meu chefe é muito severo.'},{de:'Der Chef hat das Projekt genehmigt.',pt:'O chefe aprovou o projeto.'}], trick:'👔 "CHEF" é idêntico ao francês e igual em português! Chefe em alemão = chef. Sem truque necessário — é a mesma palavra!' },
      { de:'die Konferenz', pt:'a conferência', def:'Reunião formal de grande porte para discussão profissional.', ex:[{de:'Die Konferenz findet in Berlin statt.',pt:'A conferência acontece em Berlim.'},{de:'Ich nehme an der Konferenz teil.',pt:'Estou participando da conferência.'}], trick:'🎤 "KONFERENZ" é quase igual a "conferência"! K=C, ferenz=ferência. Palavras quase gêmeas!' },
      { de:'das Gehalt', pt:'o salário', def:'Remuneração mensal fixa paga ao trabalhador pelo empregador.', ex:[{de:'Mein Gehalt ist gut.',pt:'Meu salário é bom.'},{de:'Er hat eine Gehaltserhöhung bekommen.',pt:'Ele recebeu um aumento de salário.'}], trick:'💵 "Ge-HALT" = "ge" + "halten" (manter). Salário é o que você recebe para se MANTER vivo. O empregador te "mantém" trabalhando!' },
      { de:'die Steuer', pt:'o imposto / tributo', def:'Valor obrigatório cobrado pelo governo sobre renda ou atividades.', ex:[{de:'Die Steuern sind sehr hoch.',pt:'Os impostos são muito altos.'},{de:'Ich muss Steuern zahlen.',pt:'Tenho que pagar impostos.'}], trick:'😫 "STEUER" também significa VOLANTE de carro! O governo DIRIGE (steuer) você para onde ele quer com os impostos!' },
      { de:'die Produktion', pt:'a produção', def:'Processo de fabricar ou criar produtos em larga escala.', ex:[{de:'Die Produktion läuft auf Hochtouren.',pt:'A produção está a todo vapor.'},{de:'Wir müssen die Produktion steigern.',pt:'Precisamos aumentar a produção.'}], trick:'🏭 "PRODUKTION" é idêntico a "produção"! Apenas troca -ção por -tion. Mais uma palavra gêmea do português!' },
      { de:'die Qualität', pt:'a qualidade', def:'Grau de excelência ou perfeição de um produto ou serviço.', ex:[{de:'Die Qualität unserer Produkte ist hoch.',pt:'A qualidade dos nossos produtos é alta.'},{de:'Qualität vor Quantität.',pt:'Qualidade antes de quantidade.'}], trick:'⭐ "QUALITÄT" = qualidade com sotaque alemão. Quase igual! Qualit-ät = qualid-ade. O sufixo -ät alemão = -ade português!' },
      { de:'die Kündigung', pt:'a demissão / rescisão', def:'Término formal de um contrato de trabalho.', ex:[{de:'Er hat eine Kündigung erhalten.',pt:'Ele recebeu uma demissão.'},{de:'Die Kündigung kam ohne Vorwarnung.',pt:'A demissão veio sem aviso prévio.'}], trick:'✂️ "KÜNDIGUNG" vem de "kündigen" = anunciar/terminar. Lembra "CUNDIR" — quando alguém é demitido, a notícia CUNDE pelo escritório!' },
      { de:'der Markt', pt:'o mercado', def:'Espaço físico ou virtual onde ocorre a compra e venda de bens.', ex:[{de:'Der Markt wächst schnell.',pt:'O mercado cresce rapidamente.'},{de:'Wir müssen den Markt analysieren.',pt:'Precisamos analisar o mercado.'}], trick:'🛒 "MARKT" = market! Soa quase igual em inglês. Markt = Market = Mercado. Fácil!' },
      { de:'die Werbung', pt:'a publicidade / propaganda', def:'Comunicação criada para promover produtos ou serviços.', ex:[{de:'Die Werbung ist sehr kreativ.',pt:'A publicidade é muito criativa.'},{de:'Wir investieren viel in Werbung.',pt:'Investimos muito em publicidade.'}], trick:'📺 "WERBUNG" vem de "werben" = recrutar/seduzir. Propaganda é literalmente o ato de te SEDUZIR para comprar algo!' },
      { de:'die Strategie', pt:'a estratégia', def:'Plano de longo prazo para atingir objetivos específicos.', ex:[{de:'Wir brauchen eine bessere Strategie.',pt:'Precisamos de uma estratégia melhor.'},{de:'Die Strategie war erfolgreich.',pt:'A estratégia foi bem-sucedida.'}], trick:'♟️ "STRATEGIE" = estratégia! Idêntico com pequena diferença ortográfica. Strateg-ie = estratég-ia. Palavras irmãs!' },
      { de:'die Filiale', pt:'a filial / sucursal', def:'Estabelecimento que faz parte de uma empresa maior.', ex:[{de:'Wir eröffnen eine neue Filiale.',pt:'Estamos abrindo uma nova filial.'},{de:'Die Filiale ist in München.',pt:'A filial fica em Munique.'}], trick:'🏢 "FILIALE" vem do latim "filia" = filha! A filial é a FILHA da matriz. Fil-iale = fil-ial. Exatamente igual ao português!' },
      { de:'der Bericht', pt:'o relatório / reportagem', def:'Documento que apresenta informações sobre algo de forma organizada.', ex:[{de:'Ich muss einen Bericht schreiben.',pt:'Preciso escrever um relatório.'},{de:'Der Bericht ist sehr detailliert.',pt:'O relatório é muito detalhado.'}], trick:'📋 "Be-RICHT" vem de "richten" = direcionar. Um relatório DIRECIONA a atenção de quem lê para o que importa. Be-richt = be-direcionado!' },
      { de:'der Auftrag', pt:'a encomenda / ordem de serviço', def:'Pedido formal para realizar um trabalho ou serviço específico.', ex:[{de:'Wir haben einen neuen Auftrag.',pt:'Temos uma nova ordem de serviço.'},{de:'Der Auftrag muss bis Freitag fertig sein.',pt:'A encomenda deve estar pronta até sexta.'}], trick:'📋 "AUF-TRAG" = auf (em cima) + tragen (carregar). Um pedido é um peso que você carrega em cima de você até entregar!' },
      { de:'die Partnerschaft', pt:'a parceria / sociedade', def:'Relação de colaboração formal entre duas ou mais partes.', ex:[{de:'Wir haben eine starke Partnerschaft.',pt:'Temos uma parceria sólida.'},{de:'Die Partnerschaft ist sehr erfolgreich.',pt:'A parceria é muito bem-sucedida.'}], trick:'🤝 "PARTNER-schaft" = parceiro + sufixo. Partnerschaft = partner-ship em inglês. Parceiro = partner. Simples!' },
      { de:'der Konkurrent', pt:'o concorrente', def:'Empresa ou pessoa que compete no mesmo mercado.', ex:[{de:'Unser Konkurrent ist sehr stark.',pt:'Nosso concorrente é muito forte.'},{de:'Wir müssen die Konkurrenten beobachten.',pt:'Precisamos observar os concorrentes.'}], trick:'⚔️ "KONKURRENT" é quase "concorrente" em português! Kon = con, kurrent = corrente. Ambos vêm do latim "concurrere" = correr junto!' },
    ]
  },
  social: {
    label: 'Social', icon: '🤝',
    words: [
      { de:'sich vorstellen', pt:'se apresentar', def:'Dizer quem você é para alguém pela primeira vez.', ex:[{de:'Darf ich mich vorstellen? Ich bin Klaus.',pt:'Posso me apresentar? Sou Klaus.'},{de:'Er hat sich ihr vorgestellt.',pt:'Ele se apresentou a ela.'}], trick:'🪞 "VOR-stellen" = colocar NA FRENTE. Quando você se apresenta, você literalmente se "coloca na frente" das pessoas!' },
      { de:'die Einladung', pt:'o convite', def:'Pedido formal para que alguém participe de um evento ou atividade.', ex:[{de:'Danke für die Einladung!',pt:'Obrigado pelo convite!'},{de:'Ich habe eine Einladung zur Party bekommen.',pt:'Recebi um convite para a festa.'}], trick:'📨 "EIN-ladung" = EIN (dentro) + laden (carregar). Um convite é um "carregamento" de você para dentro de um evento!' },

      { de:'die Wanderung', pt:'a caminhada / trilha', def:'Percurso longo a pé pela natureza para lazer ou exercício.', ex:[{de:'Die Wanderung war sehr schön.',pt:'A caminhada foi muito bonita.'},{de:'Wie lange dauert die Wanderung?',pt:'Quanto tempo dura a trilha?'}], trick:'🥾 "WANDER" = vaguear/caminhar! Em inglês "to wander" = vaguear. Wanderung = a ação de vaguear pela natureza. Wandern = wandering!' },
      { de:'die Autobahn', pt:'a rodovia / autoestrada', def:'Via rápida para automóveis sem cruzamentos nem semáforos.', ex:[{de:'Die Autobahn hat kein Tempolimit.',pt:'A autoestrada não tem limite de velocidade.'},{de:'Wir fahren auf der Autobahn.',pt:'Dirigimos pela rodovia.'}], trick:'🚗 "AUTO" = carro + "BAHN" = trilha/pista. Auto-bahn = pista de carros! "Bahn" = caminho, trilho. Mesmo em "U-Bahn" (metrô = trilho subterrâneo)!' },
      { de:'die Unterkunft', pt:'a hospedagem', def:'Local onde viajantes ficam hospedados durante uma viagem.', ex:[{de:'Wir suchen eine günstige Unterkunft.',pt:'Estamos procurando uma hospedagem barata.'},{de:'Die Unterkunft ist sehr komfortabel.',pt:'A hospedagem é muito confortável.'}], trick:'🏠 "UNTER" (sob) + "KUNFT" (chegada). Você CHEGA e fica ABRIGADO (sob um teto). Unter-kunft = abrigo de chegada!' },
      { de:'der Hafen', pt:'o porto', def:'Local abrigado onde navios e barcos atracam e carregam.', ex:[{de:'Das Schiff liegt im Hafen.',pt:'O navio está no porto.'},{de:'Der Hafen ist sehr belebte.',pt:'O porto é muito movimentado.'}], trick:'⚓ "HAFEN" em inglês é "haven" = refúgio! Porto = lugar de REFÚGIO para barcos. Hamburg vem de "Ham" + "burg" (fortaleza do porto). Hafen = haven!' },
      { de:'die Hauptstadt', pt:'a capital', def:'Cidade sede do governo de um país ou estado.', ex:[{de:'Berlin ist die Hauptstadt Deutschlands.',pt:'Berlim é a capital da Alemanha.'},{de:'Was ist die Hauptstadt von Österreich?',pt:'Qual é a capital da Áustria?'}], trick:'👑 "HAUPT" = cabeça/principal + "STADT" = cidade. Capital = a "cidade-cabeça"! Hauptstadt = head-city. A cabeça do país!' },
      { de:'das Schloss', pt:'o castelo / palácio', def:'Edificação histórica grandiosa, geralmente de nobreza ou realeza.', ex:[{de:'Das Schloss ist sehr alt.',pt:'O castelo é muito antigo.'},{de:'Wir besichtigen das Schloss.',pt:'Visitamos o castelo.'}], trick:'🏰 "SCHLOSS" também significa FECHADURA! Um castelo é a maior FECHADURA do mundo — difícil de invadir. Schloss = lock = castle. Coincidência linguística!' },
      { de:'günstig', pt:'barato / conveniente', def:'Com preço acessível ou em condições favoráveis.', ex:[{de:'Das ist sehr günstig!',pt:'Isso é muito barato!'},{de:'Wir suchen ein günstiges Hotel.',pt:'Estamos procurando um hotel barato.'}], trick:'💸 "GÜNST" vem de "Gunst" = favor/graça. "Günstig" = favorável ao bolso, com preço que te FAZ UM FAVOR. Gunstig = gracioso com o preço!' },
      { de:'die Reiseroute', pt:'o itinerário / rota de viagem', def:'Sequência planejada de destinos e paradas de uma viagem.', ex:[{de:'Was ist unsere Reiseroute?',pt:'Qual é nosso itinerário?'},{de:'Wir haben die Reiseroute geplant.',pt:'Planejamos a rota de viagem.'}], trick:'🗺️ "REISE" = viagem + "ROUTE" = rota. Reise-route = rota de viagem! Route é quase igual em português. Simples e direto!' },
    ]
  }
};

const GROUP_SIZE = 5;
const state = {
  theme: null,
  mode: 'study',
  wordIdx: 0,
  groupIdx: 0,
  quizState: null,
  groupsDone: []
};

function words() { return THEMES[state.theme]?.words || []; }
function getGroup(i) { return words().slice(i * GROUP_SIZE, (i+1) * GROUP_SIZE); }
function numGroups() { return Math.ceil(words().length / GROUP_SIZE); }

function render() {
  const root = document.getElementById('main');
  if (!state.theme) { root.innerHTML = renderWelcome(); return; }
  const w = words();
  const done = state.groupIdx * GROUP_SIZE + (state.mode === 'quiz' ? GROUP_SIZE : state.wordIdx);
  const pct = Math.round(Math.min(done / w.length, 1) * 100);
  let html = renderProgress(done, w.length, pct) + renderGroupNav() + renderModeTabs();
  if (state.mode === 'study') html += renderWord();
  else html += renderQuizPanel();
  root.innerHTML = html;
}

function renderWelcome() {
  return `
  <div class="welcome">
    <h2>Escolha um tema para começar</h2>
    <p>Estude palavras com definição, exemplos reais de filmes e livros, truques de memória engraçados, e faça quiz a cada 5 palavras — até acertar 100%!</p>
  </div>
  <div class="theme-grid">
    ${Object.entries(THEMES).map(([k,v])=>`
      <div class="theme-card" onclick="selectTheme('${k}')">
        <div class="icon">${v.icon}</div>
        <div class="name">${v.label}</div>
        <div class="count">${v.words.length} palavras</div>
      </div>`).join('')}
  </div>`;
}

function renderProgress(done, total, pct) {
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
    <span style="font-size:13px;color:var(--text-2)">${THEMES[state.theme].icon} ${THEMES[state.theme].label}</span>
    <button onclick="selectTheme(null)" style="font-size:12px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">trocar tema</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-label">${done} de ${total} palavras</span>
      <span class="progress-pct">${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function renderGroupNav() {
  const pills = Array.from({length:numGroups()},(_,i)=>{
    let cls='gn-pill';
    if(i===state.groupIdx)cls+=' active';
    else if(state.groupsDone.includes(i))cls+=' done';
    return `<div class="${cls}" onclick="goGroup(${i})">Grupo ${i+1}</div>`;
  }).join('');
  return `<div class="group-nav">${pills}</div>`;
}

function renderModeTabs() {
  return `<div class="mode-tabs">
    <div class="mode-tab ${state.mode==='study'?'active':''}" onclick="setMode('study')">📖 Estudar</div>
    <div class="mode-tab ${state.mode==='quiz'?'active':''}" onclick="setMode('quiz')">🧠 Quiz</div>
  </div>`;
}

function renderWord() {
  const group = getGroup(state.groupIdx);
  const word = group[state.wordIdx];
  if (!word) return '';
  const global = state.groupIdx * GROUP_SIZE + state.wordIdx + 1;
  const isLast = state.wordIdx === group.length - 1;
  return `
  <div class="word-card">
    <div class="word-top">
      <div>
        <div class="word-de">${word.de}</div>
        <div class="word-pt">${word.pt}</div>
      </div>
      <span class="word-badge">#${global} / ${words().length}</span>
    </div>
    <div class="section-label">Definição</div>
    <div class="definition">${word.def}</div>
    <div class="section-label">Exemplos reais</div>
    <div class="examples">
      ${word.ex.map(e=>`<div class="example"><div class="ex-de">${e.de}</div><div class="ex-pt">${e.pt}</div></div>`).join('')}
    </div>
    <div class="section-label">Truque de memória</div>
    <div class="trick-box">${word.trick}</div>
    <div class="nav-row" style="margin-top:1.25rem">
      <button class="btn" onclick="prevWord()" ${state.wordIdx===0&&state.groupIdx===0?'disabled':''}>← Anterior</button>
      ${isLast
        ? `<button class="btn primary" onclick="setMode('quiz')">🧠 Fazer quiz →</button>`
        : `<button class="btn primary" onclick="nextWord()">Próxima →</button>`}
    </div>
  </div>`;
}

function renderQuizPanel() {
  const group = getGroup(state.groupIdx);
  if (!state.quizState) initQuiz(group);
  const qs = state.quizState;
  if (qs.finished) return renderResult(qs, group);
  const q = qs.questions[qs.qIdx];
  const dots = qs.questions.map((_,i)=>{
    let cls = 'dot';
    if(i<qs.qIdx) cls+=qs.results[i]?' hit':' miss';
    else if(i===qs.qIdx) cls+=' cur';
    return `<div class="${cls}"></div>`;
  }).join('');
  const fb = qs.lastFeedback;
  return `
  <div class="quiz-card">
    <div class="quiz-header">
      <div class="quiz-title">Quiz — Grupo ${state.groupIdx+1}</div>
      <div class="quiz-sub">Pergunta ${qs.qIdx+1} de ${qs.questions.length}</div>
    </div>
    <div class="dots-row">${dots}</div>
    <div class="quiz-q">O que significa <span class="quiz-highlight">"${q.word.de}"</span>?</div>
    <div class="options-grid">
      ${q.options.map((opt,i)=>{
        let cls='opt';
        if(fb){if(i===q.correct)cls+=' correct';else if(i===qs.chosenIdx&&i!==q.correct)cls+=' wrong';}
        return `<button class="${cls}" ${fb?'disabled':''} onclick="answerQuiz(${i})">${opt}</button>`;
      }).join('')}
    </div>
    ${fb?`<div class="feedback ${qs.results[qs.qIdx]?'ok':'err'}">${fb}</div>`:''}
    ${fb?`<button class="btn primary" style="width:100%" onclick="nextQ()">Próxima pergunta →</button>`:''}
  </div>`;
}

function renderResult(qs, group) {
  const hits = qs.results.filter(Boolean).length;
  const total = qs.results.length;
  const pct = Math.round(hits/total*100);
  const perfect = pct===100;
  const hasNext = state.groupIdx < numGroups()-1;
  return `
  <div class="quiz-card">
    <div class="result-box">
      <div class="result-emoji">${perfect?'🏆':'📚'}</div>
      <div class="result-score">${pct}%</div>
      <div class="result-title">${perfect?'Perfeito! Grupo concluído!':'Quase lá!'}</div>
      <div class="result-sub">${hits} de ${total} corretas</div>
      ${!perfect?`<button class="btn" style="margin:0 auto 1rem;max-width:280px;display:flex" onclick="retryQuiz()">🔄 Repetir até 100%</button>`:''}
      ${perfect&&hasNext?`<button class="btn primary" style="margin:0 auto;max-width:280px;display:flex" onclick="nextGroup()">Próximo grupo →</button>`:''}
      ${perfect&&!hasNext?`<div style="color:var(--green);font-size:15px;font-weight:600;margin-top:0.5rem">🎉 Você concluiu todo o tema!</div>`:''}
    </div>
  </div>`;
}

function initQuiz(group) {
  const questions = group.map((word,i)=>{
    const others = group.filter((_,j)=>j!==i).map(w=>w.pt);
    const opts = [...others.sort(()=>Math.random()-.5).slice(0,3), word.pt].sort(()=>Math.random()-.5);
    return {word, options:opts, correct:opts.indexOf(word.pt)};
  }).sort(()=>Math.random()-.5);
  state.quizState = {questions, qIdx:0, results:[], lastFeedback:null, chosenIdx:null, finished:false};
}

window.selectTheme = (k) => {
  state.theme = k; state.wordIdx=0; state.groupIdx=0;
  state.mode='study'; state.quizState=null; state.groupsDone=[]; render();
};
window.goGroup = (i) => { state.groupIdx=i; state.wordIdx=0; state.mode='study'; state.quizState=null; render(); };
window.setMode = (m) => { state.mode=m; if(m==='quiz') state.quizState=null; render(); };
window.prevWord = () => {
  if(state.wordIdx>0) state.wordIdx--;
  else if(state.groupIdx>0){state.groupIdx--;state.wordIdx=GROUP_SIZE-1;state.quizState=null;}
  render();
};
window.nextWord = () => { state.wordIdx++; render(); };
window.answerQuiz = (i) => {
  const qs=state.quizState; const q=qs.questions[qs.qIdx];
  qs.chosenIdx=i; const ok=i===q.correct;
  qs.results[qs.qIdx]=ok;
  qs.lastFeedback=ok
    ?`✅ Correto! "${q.word.de}" = ${q.word.pt}. ${q.word.trick.substring(0,70)}...`
    :`❌ Era "${q.word.pt}". Lembra: ${q.word.trick.substring(0,70)}...`;
  render();
};
window.nextQ = () => {
  const qs=state.quizState; qs.qIdx++; qs.lastFeedback=null; qs.chosenIdx=null;
  if(qs.qIdx>=qs.questions.length) qs.finished=true;
  render();
};
window.retryQuiz = () => { state.quizState=null; render(); };
window.nextGroup = () => {
  if(!state.groupsDone.includes(state.groupIdx)) state.groupsDone.push(state.groupIdx);
  state.groupIdx++; state.wordIdx=0; state.mode='study'; state.quizState=null; render();
};

render();
</script>
</body>
</html>
